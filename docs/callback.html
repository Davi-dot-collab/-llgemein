<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clipbot Login</title><link rel="stylesheet" href="style.css"></head><body>
<h1>Login abgeschlossen</h1>
<p>Kopiere diesen Code in das Terminal (clipbot tiktok-auth --code ...):</p>

</body></html>
